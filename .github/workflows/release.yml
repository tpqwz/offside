# Compile the CERT C offside command and attach the zips to a GitHub release.
# The binary is the command. It still calls the host C or Pascal compiler.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the binaries to
        required: true
        default: v0.1.0-alpha.1
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            cc: gcc
            bin: offside
          - name: linux-arm64
            os: ubuntu-latest
            cc: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu
            bin: offside
          - name: macos-x64
            os: macos-latest
            cc: clang
            cflags: -arch x86_64
            bin: offside
          - name: macos-arm64
            os: macos-latest
            cc: clang
            bin: offside
          - name: windows-x64
            os: ubuntu-latest
            cc: x86_64-w64-mingw32-gcc
            packages: gcc-mingw-w64
            bin: offside.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - name: Cross compiler
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: Compile
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CFLAGS: ${{ matrix.cflags }}
        run: |
          set -euo pipefail
          make -C c
          mkdir -p pack
          cp "c/build/${{ matrix.bin }}" "pack/${{ matrix.bin }}"
          (cd pack && zip -q "../offside-${{ matrix.name }}.zip" "${{ matrix.bin }}")
      - uses: actions/upload-artifact@v4
        with:
          name: offside-${{ matrix.name }}
          path: offside-${{ matrix.name }}.zip
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            tag="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            echo "no release tag" >&2
            exit 1
          fi
          files=(dist/*/*.zip)
          if [ "${#files[@]}" -ne 5 ]; then
            echo "expected 5 packs, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber
